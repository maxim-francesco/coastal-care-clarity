<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>OG Image Template — Coastal Care Home Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #1d1d1f;
    }
    .card {
      width: 1200px;
      height: 630px;
      padding: 80px 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
    }
    .top-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .accent-bar {
      width: 48px;
      height: 5px;
      background-color: #0071e3;
      border-radius: 2.5px;
      margin-bottom: 36px;
    }
    .brand-title {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: #1d1d1f;
      margin-bottom: 20px;
    }
    .services-line {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.35;
      color: #1d1d1f;
      letter-spacing: -0.01em;
    }
    .bottom-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid #f5f5f7;
      padding-top: 28px;
    }
    .cities-line {
      font-size: 21px;
      font-weight: 400;
      color: #6e6e73;
      letter-spacing: -0.005em;
    }
    .phone-number {
      font-size: 21px;
      font-weight: 500;
      color: #6e6e73;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-content">
      <div class="accent-bar"></div>
      <h1 class="brand-title">Coastal Care Home Services</h1>
      <p class="services-line">Cleaning &middot; Turnovers &middot; Home Management &middot; Home Watch</p>
    </div>
    <div class="bottom-content">
      <p class="cities-line">Naples &middot; Bonita Springs &middot; Estero &middot; Fort Myers &middot; Marco Island</p>
      <p class="phone-number">(239) 571-4461</p>
    </div>
  </div>
</body>
</html>
